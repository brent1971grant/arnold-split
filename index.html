<style>
  /* One design for every tab (from Brent's Training Record): navy brand, brass accents,
     condensed display numerals, mono labels. Light and dark follow the phone's setting. */
  :root{
    --navy:#16324F; --ink:#16212c; --muted:#5f6d7b; --bg:#f2f4f7; --card:#ffffff; --line:#e3e8ed;
    --soft:#eaeef2; --field:#ffffff; --field-line:#d3dae1; --accent:#16324F; --link:#2276b3;
    --btn2:#39566f; --note:#fff6df; --toast-bg:#16212c; --toast-ink:#ffffff; --chart-ink:#16324F;
    --shadow:0 1px 3px rgba(16,30,45,.08); --brass:#a77a22;
    --cb:#EBF5FB; --sa:#F5EEF8; --lg:#FEF9E7; --rr:#F2F3F4;
    --cb-d:#2E86C1; --sa-d:#8E44AD; --lg-d:#9c7f0a; --rr-d:#6f7d86;
    --good:#1e8449; --bad:#c0392b; --warn:#c27c0e;
    --disp:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root{
    --ink:#e7ecf1; --muted:#93a0ad; --bg:#0c141c; --card:#15202b; --line:#253341;
    --soft:#1e2b38; --field:#0f1922; --field-line:#2d3c4b; --accent:#3a6d9e; --link:#7fb8e6;
    --btn2:#2a3d50; --note:#2e2714; --toast-bg:#e7ecf1; --toast-ink:#0c141c; --chart-ink:#cdd7e1;
    --shadow:0 0 0 1px var(--line); --brass:#d6a64a;
    --cb:#12283a; --sa:#24192e; --lg:#2a2411; --rr:#1c232a;
    --cb-d:#62b0e6; --sa-d:#c39ad6; --lg-d:#dcb53a; --rr-d:#9aa7b1;
    --good:#4fbf83; --bad:#ef6f62; --warn:#f0ae4c;
    color-scheme:dark;
  } }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
  header{background:var(--navy); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center;}
  header h1{font:800 21px/1 var(--disp); margin:0; letter-spacing:.06em;}
  #syncBadge{font:500 10.5px/1 var(--mono); letter-spacing:.04em; opacity:.8;}
  main{padding:14px; max-width:560px; margin:0 auto;}
  .card{background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow);}
  .muted{color:var(--muted); font-size:12px;}
  h2{font:700 19px/1.1 var(--disp); text-transform:uppercase; letter-spacing:.03em; color:var(--ink); margin:2px 0 10px;}
  .eyebrow{font:500 10.5px/1.3 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  /* Today */
  .editbar{background:var(--note); padding:10px 16px;}
  .focus-title{font:800 34px/1 var(--disp); text-transform:uppercase; letter-spacing:.02em; margin:8px 0 4px;}
  .btn-row{display:flex; gap:8px; margin:14px 0 12px;}
  button.big{flex:1; padding:14px 4px; border:none; border-radius:12px; font-size:15px; font-weight:700; background:var(--soft); color:var(--ink);}
  button.big.on-done{background:var(--good); color:#fff;}
  button.big.on-miss{background:var(--bad); color:#fff;}
  button.big.on-plan{background:var(--accent); color:#fff;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .chip{padding:7px 12px; border-radius:18px; font-size:13px; border:1.5px solid var(--field-line); background:var(--field); color:var(--ink);}
  .chip.sm{padding:5px 11px; font-size:12px;}
  .chip.sel{border-color:var(--accent); background:var(--accent); color:#fff; font-weight:600;}
  input[type=number], textarea, input[type=text], input[type=password], input[type=date]{
    width:100%; padding:10px 12px; border:1.5px solid var(--field-line); border-radius:10px; font-size:16px; background:var(--field); color:var(--ink);}
  input:focus, textarea:focus{outline:none; border-color:var(--link);}
  textarea{resize:vertical; min-height:44px;}
  label.fld{display:block; font:500 10.5px/1.3 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:12px 0 5px;}
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1; min-width:0;}
  .wo{background:var(--soft); border-radius:10px; padding:8px 10px; font-size:13px; margin-top:12px; line-height:1.55;}
  .chip .cnt{display:inline-block; min-width:18px; margin-left:6px; padding:1px 5px; border-radius:9px; background:var(--brass); color:#fff; font-size:11px; font-weight:700; text-align:center;}
  .chip.open{box-shadow:inset 0 0 0 2px var(--brass);}
  .composer{background:var(--soft); border-radius:12px; padding:10px 12px 12px; margin:2px 0 8px;}
  .composer input{margin-top:6px;}
  .composer .row2 .primary{margin-top:8px;}
  .entries{display:grid; gap:7px; margin:4px 0 2px;}
  .entry{display:flex; align-items:baseline; gap:8px; font-size:14px; line-height:1.4;}
  .entry .et{font:500 11px/1 var(--mono); color:var(--muted); white-space:nowrap;}
  .entry .tx{flex:1; min-width:0; overflow-wrap:anywhere;}
  .entry .x{border:none; background:none; color:var(--muted); font-size:20px; line-height:1; padding:0 4px; align-self:center;}
  .ptotal{margin:8px 0 2px; padding:9px 12px; border-radius:10px; background:var(--soft);}
  .ptotal > div:first-child{display:flex; align-items:baseline; gap:8px;}
  .ptotal b{font:800 24px/1 var(--disp);}
  .ptotal small{color:var(--muted); font-size:12px;}
  .jitem{font-size:14px; line-height:1.45; margin-top:3px;}
  .jitem .et{font:500 11px/1 var(--mono); color:var(--muted); margin:0 4px;}
  .wtag{display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:9px; background:var(--soft); color:var(--muted); margin-right:4px;}
  .warnline{color:var(--warn); font-weight:600;}
  /* Plan list */
  .block-h{font:500 10.5px/1 var(--mono); letter-spacing:.14em; color:var(--brass); margin:24px 4px 4px; padding-top:12px; border-top:2px solid var(--brass);}
  .week-h{font:700 16px/1 var(--disp); letter-spacing:.04em; color:var(--muted); margin:14px 4px 6px; text-transform:uppercase;}
  .day-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; margin-bottom:5px;}
  .day-row .d{width:62px; font-size:12px; line-height:1.25;}
  .day-row .f{flex:1; font-size:14px; font-weight:600;}
  .day-row .s{display:flex;}
  .day-row.today-row{outline:2px solid var(--accent);}
  .offplan{font-size:11px; color:var(--warn); font-weight:700;}
  /* Stats */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat{text-align:center; padding:8px 2px;}
  .stat .v{font:800 30px/1.05 var(--disp);}
  .stat .v.sm{font-size:20px; padding:5px 0;}
  .stat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--muted); font:500 10px/1.2 var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:6px 4px; border-bottom:1px solid var(--line);}
  td{padding:7px 4px; border-bottom:1px solid var(--line);}
  td.num, th.num{text-align:right;}
  .bar{height:6px; background:var(--soft); border-radius:3px; overflow:hidden; margin-top:6px;}
  .bar > div{height:100%; background:var(--good); border-radius:3px;}
  /* Nav */
  nav{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:0 max(6px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px, env(safe-area-inset-left)); z-index:10;}
  nav button{flex:1; border:none; background:none; padding:8px 0 7px; font-size:10.5px; color:var(--muted); font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav button svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
    padding:3px 12px; box-sizing:content-box; border-radius:14px;}
  nav button.sel{color:var(--ink);}
  nav button.sel svg{background:var(--soft); color:var(--brass); stroke-width:2.1;}
  .hide{display:none;}
  .toast{position:fixed; bottom:calc(86px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--toast-bg); color:var(--toast-ink);
    padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:20; max-width:90%; text-align:center;}
  .toast.show{opacity:.96;}
  button.link{background:none;border:none;color:var(--link);font-size:14px;font-weight:600;padding:6px 0;}
  button.primary{width:100%; padding:13px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; margin-top:10px;}
  button.primary.alt{background:var(--btn2);}
  button:focus-visible{outline:3px solid var(--link); outline-offset:2px;}
  /* Setup: everyday settings first, technical ones folded away */
  details.adv{margin-top:18px;}
  details.adv > summary{list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    font:500 10.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:12px 4px;}
  details.adv > summary::-webkit-details-marker{display:none;}
  details.adv > summary::after{content:'+'; font:700 18px/1 var(--disp);}
  details.adv[open] > summary::after{content:'\2013';}
  /* Stats, in the style of Brent's Training Record dashboard: navy journey band, brass accents,
     condensed display numerals, mono labels. */
  .jband{background:var(--navy); color:#fff; border-radius:14px; padding:18px; margin-bottom:12px; display:grid; gap:12px;}
  .jband .eyebrow{color:rgba(255,255,255,.7);}
  .jscale{display:flex; flex-wrap:wrap; align-items:flex-end; gap:6px clamp(6px, 2.4vw, 14px);}
  .jscale > div{display:grid; gap:3px;}
  .jscale b{font:800 clamp(28px, 8.2vw, 42px)/.9 var(--disp);}
  .jscale span{font:500 9px/1.2 var(--mono); letter-spacing:.08em; text-transform:uppercase; opacity:.75; white-space:nowrap;}
  .jscale i{font:700 clamp(16px, 5vw, 22px)/1 var(--disp); font-style:normal; opacity:.45; padding-bottom:12px;}
  .jscale .gold b{color:#f2c46a;}
  .jscale .togo{padding-left:clamp(6px, 2.4vw, 12px); border-left:1px solid rgba(255,255,255,.25);}
  .jbar{height:10px; background:rgba(255,255,255,.16); border-radius:5px; overflow:hidden;}
  .jbar i{display:block; height:100%; background:linear-gradient(90deg,#d9a845,#f2c46a); border-radius:5px;}
  .jlabels{display:flex; justify-content:space-between; gap:8px; font:500 10.5px/1.2 var(--mono); opacity:.8;}
  .jmj{font:500 12px/1.4 var(--mono); color:rgba(255,255,255,.85);}
  .jmj b{color:#f2c46a; font-weight:500;}
  .tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:12px;}
  .tile{background:var(--card); border-radius:14px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.07); display:grid; gap:4px; min-width:0;}
  .tile b{font:800 32px/1 var(--disp);}
  .tile small{font-size:11.5px; color:var(--muted);}
  .pbs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
  .pbs.three{grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
  .pb{border-top:3px solid var(--brass); padding-top:7px; display:grid; gap:2px; align-content:start; min-width:0;}
  .pb b{font:800 22px/1.1 var(--disp);}
  .pb span{font-size:11.5px; line-height:1.35; color:var(--muted);}
  .doses{display:flex; height:30px; border-radius:6px; overflow:hidden; gap:2px; margin:4px 0 6px;}
  .doses > div{display:flex; align-items:center; justify-content:center; padding:0 4px; font:500 11px/1 var(--mono); color:#fff; white-space:nowrap; overflow:hidden; min-width:54px;}
  .doses > div.plan{color:var(--ink); background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px); border:1px dashed var(--brass);}
  .dlegend{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font:500 10.5px/1.2 var(--mono); color:var(--muted); margin-bottom:4px;}
  .sec-h{font:500 10.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:22px 4px 10px;}
  .chip-s{display:inline-block; font:500 10.5px/1.2 var(--mono); padding:4px 6px; border-radius:4px; white-space:nowrap;}
  /* Welcome: once a day, "the gym at night". Spotlight and chalk dust behind, progress drawn
     as a weight plate, waits for LET'S GO. Tap the ARNOLD SPLIT title to see it again. */
  #welcome{--w-bg:#0a141f; --w-ink:#f4efe4; --w-dim:rgba(244,239,228,.62); --w-gold:#e5b04a; --w-steel:#1c2b3a; --w-line:rgba(244,239,228,.12);
    --w-display:"Anton","HelveticaNeue-CondensedBlack","Arial Narrow",sans-serif;
    position:fixed; inset:0; z-index:30; color:var(--w-ink); overflow-y:auto;
    background:radial-gradient(120% 65% at 88% -8%, rgba(229,176,74,.30), transparent 58%),
      radial-gradient(90% 55% at 0% 105%, rgba(46,134,193,.20), transparent 62%), var(--w-bg);
    transition:opacity .45s ease, transform .45s ease;}
  #welcome.hide{display:none;}
  #welcome.out{opacity:0; transform:translateY(-3%); pointer-events:none;}
  #welcome canvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none;}
  #welcome .wbody{position:relative; min-height:100%; display:flex; flex-direction:column; gap:18px;
    padding:calc(18px + env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));}
  #welcome .wtop{display:flex; justify-content:space-between; font-size:11px; font-weight:800; letter-spacing:3px; color:var(--w-dim);}
  #welcome h2{font:400 clamp(44px,13vw,60px)/.92 var(--w-display); text-transform:uppercase; letter-spacing:.5px; color:var(--w-ink); margin:6px 0 0;}
  #welcome h2 span{color:var(--w-gold); display:block;}
  #welcome .wplate{align-self:center; width:min(230px,60vw); aspect-ratio:1; max-width:100%;}
  #welcome .wshot{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; border-radius:12px;
    border:1px solid rgba(229,176,74,.45); background:rgba(229,176,74,.10);}
  #welcome .wshot small{display:block; font-size:10px; font-weight:800; letter-spacing:2px; color:var(--w-gold);}
  #welcome .wshot b{font:400 22px/1.15 var(--w-display); letter-spacing:.5px;}
  #welcome .wsmall{border:none; border-radius:10px; background:var(--w-gold); color:#0a141f; font:400 18px/1 var(--w-display); letter-spacing:1px; padding:11px 14px; cursor:pointer;}
  #welcome .wdone{font-weight:800; color:var(--w-gold); white-space:nowrap;}
  #welcome .wweigh label{display:block; font-size:10px; font-weight:800; letter-spacing:2px; color:var(--w-dim); margin-bottom:6px; text-transform:uppercase;}
  #welcome .wkgrow{display:flex; align-items:center; gap:10px;}
  #welcome .wkgrow input{flex:1; width:100%; background:rgba(255,255,255,.06); border:1px solid var(--w-line); color:var(--w-ink);
    font:400 26px/1 var(--w-display); letter-spacing:.5px; padding:10px 14px; border-radius:12px;}
  #welcome .wkgrow input::placeholder{color:var(--w-dim);}
  #welcome .wkgrow span{color:var(--w-dim); font-weight:700;}
  #welcome .wplate svg{width:100%; height:100%; overflow:visible;}
  #welcome .wnum{font:400 64px/1 var(--w-display);}
  #welcome .wchips{display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:10px;}
  #welcome .wchip{border-top:2px solid var(--w-gold); padding-top:8px;}
  #welcome .wchip b{display:block; font:400 30px/1 var(--w-display);}
  #welcome .wchip small{display:block; margin-top:4px; font-size:10px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--w-dim);}
  #welcome .wtoday{background:rgba(255,255,255,.05); border:1px solid var(--w-line); border-left:4px solid var(--w-gold); border-radius:12px; padding:12px 14px;}
  #welcome .wtoday small{font-size:10px; font-weight:800; letter-spacing:2px; color:var(--w-dim);}
  #welcome .wtoday b{display:block; font:400 28px/1.1 var(--w-display); text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}
  #welcome .wtoday p{margin:4px 0 0; font-size:13px; line-height:1.45; color:var(--w-dim);}
  #welcome .wtoday p em{font-style:normal; color:var(--w-gold); font-weight:700;}
  #welcome .wgo{margin-top:auto; width:100%; min-height:58px; border:none; border-radius:14px; background:var(--w-gold); color:#0a141f;
    font:400 24px/1 var(--w-display); letter-spacing:2px; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer;
    box-shadow:0 10px 30px rgba(229,176,74,.25);}
  #welcome .wgo:active{transform:scale(.98);}
  #welcome .wgo:focus-visible{outline:3px solid var(--w-ink); outline-offset:3px;}
  #welcome .rise{animation:wrise .7s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes wrise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  header h1{cursor:pointer;}
  @media (prefers-reduced-motion: reduce){ #welcome, #welcome .rise{transition:none; animation:none;} }
</style>
</head>
<body>
<header>
  <h1>ARNOLD SPLIT</h1>
  <span id="syncBadge">local only</span>
</header>
<main>
  <section id="view-today"></section>
  <section id="view-plan" class="hide"></section>
  <section id="view-stats" class="hide"></section>
  <section id="view-guide" class="hide"></section>
  <section id="view-settings" class="hide"></section>

<div id="welcome" class="hide" aria-live="polite"></div>

<script>
/* ====================== DATA ====================== */
const SEED = [];

const FOCI = ['Chest & Back','Shoulders & Arms','Legs','Rest & Recover'];
const TYPES = FOCI.slice(0,3);
const COLORS = {'Chest & Back':'var(--cb)','Shoulders & Arms':'var(--sa)','Legs':'var(--lg)','Rest & Recover':'var(--rr)'};
const DCOLORS = {'Chest & Back':'var(--cb-d)','Shoulders & Arms':'var(--sa-d)','Legs':'var(--lg-d)','Rest & Recover':'var(--rr-d)'};
const APP_VERSION = 19;
const TAGS = ['Shoulder','Sleep','Energy','Carbs','Protein'];
// The first lift of each session - its heaviest working set is the strength marker.
const TOP_LIFT = {'Chest & Back':'Incline Dumbbell Press','Shoulders & Arms':'Seated Barbell Overhead Press','Legs':'Machine Hack Squats'};
// Exact column list for training_log, so every row sent to the server has the same shape.
const COLS = ['date','day','week','focus','target_muscles','status','trained_as','body_weight','notes','updated_at','top_set','tags'];
// top_reps is sent only once the server has that column (seen on a pull), so a database
// without it keeps syncing. Until then reps stay on this device.
const ALL_COLS = COLS.concat('top_reps');
// Days the rolling schedule creates carry this stamp, so any real entry for the same
// date - from another device or already in the cloud - always wins the merge.
const GENERATED_AT = '1970-01-01T00:00:00.000Z';
// Goals are stored in the cloud (app_settings 'goals') so phone and desktop agree.
// These are the original programme values, used until the first sync or a change under Setup.
const DEFAULT_GOALS = { target_kg: 84, target_date: '2026-10-04', mj_start: '2026-05-16', mj_start_kg: 95,
  doses: [{ from: '2026-05-16', mg: 2.5 }], max_hr: 166, auto_complete: true, rest_days: ['Monday', 'Thursday'],
  protein_target_g: null, updated_at: '2026-07-18T00:00:00.000Z' };
const restDays = () => Array.isArray(goals.rest_days) ? goals.rest_days : ['Monday', 'Thursday'];

let rows = load('as_rows') || SEED.map(r => ({...r}));
let dirty = new Set(load('as_dirty') || []);
let cfg = load('as_cfg') || null;
let session = load('as_session') || null;
let goals = Object.assign({}, DEFAULT_GOALS, load('as_goals') || {});
let goalsDirty = !!load('as_goals_dirty');
let workouts = load('as_workouts') || [];
let autoSeen = new Set(load('as_autoseen') || []);
let repsCol = !!load('as_reps_col');

function load(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function persist(){
  localStorage.setItem('as_rows', JSON.stringify(rows));
  localStorage.setItem('as_dirty', JSON.stringify([...dirty]));
}
function saveGoalsLocal(){
  localStorage.setItem('as_goals', JSON.stringify(goals));
  localStorage.setItem('as_goals_dirty', JSON.stringify(goalsDirty));
}
function byDate(d){ return rows.find(r => r.date === d); }
function todayStr(){
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}
function setField(date, field, value){
  const r = byDate(date); if(!r) return;
  r[field] = value;
  r.updated_at = new Date().toISOString();
  dirty.add(date);
  persist();
  scheduleSync();
}
function toServer(r, cols){ const o = {}; (cols || (repsCol ? ALL_COLS : COLS)).forEach(k => { o[k] = (r[k] === undefined || (Array.isArray(r[k]) && !r[k].length)) ? null : r[k]; }); return o; }

/* ============ ROLLING SCHEDULE (never runs out) ============ */
const MUSCLES = {
  'Chest & Back':'Pectorals, Lats, Rhomboids, Traps',
  'Shoulders & Arms':'Deltoids (Front/Side/Rear), Biceps, Triceps',
  'Legs':'Quads, Hamstrings, Glutes, Calves',
  'Rest & Recover':'Full Muscle & CNS Recovery'
};
const ROT = ['Chest & Back','Shoulders & Arms','Legs'];
const DAYNAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function addDays(iso, n){
  const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayNameOf(iso){ return DAYNAMES[new Date(iso + 'T12:00:00').getDay()]; }
// Keeps the programme permanently stocked: whenever fewer than 21 days remain, it
// tops the schedule up to 12 weeks ahead of today, continuing the same pattern
// (Mon & Thu rest, rotation rolling across training days). It fills to a date rather
// than adding a fixed block, so it also catches up if the app has not been opened
// for months instead of falling short.
function extendScheduleIfNeeded(force){
  if(!rows.length) return 0;
  const sorted = [...rows].sort((a,b) => a.date < b.date ? -1 : 1);
  const last = sorted[sorted.length - 1];
  const topUpWhenBelow = addDays(todayStr(), 21);
  const fillUntil = addDays(todayStr(), 84);
  if(!force && last.date >= topUpWhenBelow) return 0;
  let rot = 0;
  for(let i = sorted.length - 1; i >= 0; i--){
    const idx = ROT.indexOf(sorted[i].focus);
    if(idx >= 0){ rot = (idx + 1) % 3; break; }
  }
  let week = last.week, date = last.date, added = 0, guard = 0;
  while(date < fillUntil && guard++ < 1500){
    date = addDays(date, 1);
    const dn = dayNameOf(date);
    if(dn === 'Monday') week++;
    let focus;
    if(restDays().includes(dn)){ focus = 'Rest & Recover'; }
    else { focus = ROT[rot]; rot = (rot + 1) % 3; }
    if(byDate(date)) continue;
    rows.push({ date, day: dn, week, focus, target_muscles: MUSCLES[focus],
      status: 'Planned', trained_as: focus, body_weight: null, notes: null,
      top_set: null, tags: null, updated_at: GENERATED_AT });
    dirty.add(date);
    added++;
  }
  if(added){ rows.sort((a,b) => a.date < b.date ? -1 : 1); persist(); scheduleSync(); }
  return added;
}

/* ====================== METRICS (pure) ====================== */
/* METRICS-START */
function computeMetrics(rows, todayISO, g){
  g = g || { target_kg: 84, mj_start: '2026-05-16', mj_start_kg: 95 };
  const isTraining = r => r.focus !== 'Rest & Recover';
  const doneTraining = r => r.status === 'Completed' && r.trained_as !== 'Rest & Recover';
  // The schedule always runs weeks ahead, so rates count only days that are due:
  // every past day, plus today once it has been marked.
  const isDue = r => r.date < todayISO || (r.date === todayISO && r.status !== 'Planned');
  const due = rows.filter(isDue);
  const types = ['Chest & Back','Shoulders & Arms','Legs'];
  const perType = types.map(t => {
    const sched = due.filter(r => r.focus === t).length;
    const comp = due.filter(r => r.trained_as === t && r.status === 'Completed').length;
    return { type:t, sched, comp, pct: sched ? comp/sched : 0 };
  });
  const completed = due.filter(doneTraining).length;
  const missed = due.filter(r => r.status === 'Missed').length;
  // Past training days never marked either way.
  const unmarked = rows.filter(r => isTraining(r) && r.status === 'Planned' && r.date < todayISO).length;
  const totalTraining = due.filter(isTraining).length;
  // Weeks up to and including this one - not the empty weeks already scheduled ahead.
  const weekNums = [...new Set(rows.filter(r => r.date <= todayISO).map(r => r.week))].sort((a,b) => a-b);
  const weekly = weekNums.map(w => {
    const wr = rows.filter(r => r.week === w);
    const sched = wr.filter(r => isDue(r) && isTraining(r)).length;
    const done = wr.filter(r => isDue(r) && doneTraining(r)).length;
    const ws = wr.filter(r => r.body_weight != null).map(r => r.body_weight);
    return { week:w, done, sched, pct: sched ? done/sched : 0,
      avgW: ws.length ? ws.reduce((a,b)=>a+b,0)/ws.length : null };
  });
  const weights = rows.filter(r => r.body_weight != null).sort((a,b)=>a.date<b.date?-1:1);
  const start = weights.length ? weights[0].body_weight : null;
  const current = weights.length ? weights[weights.length-1].body_weight : null;
  const goal = g.target_kg;
  const wm = start == null ? null : {
    start, current,
    change: +(current - start).toFixed(1),
    toGo: +(current - goal).toFixed(1),
    progress: (start - goal) !== 0 ? (start - current)/(start - goal) : 0
  };
  const mjDays = Math.floor((Date.parse(todayISO) - Date.parse(g.mj_start)) / 86400000);
  // Logged shots count exactly. Before the first logged one, assume one a week from the start.
  const inj = (g.injections || []).map(i => i.date).filter(d => d <= todayISO).sort();
  const weeksBefore = d => Math.max(0, Math.ceil((Date.parse(d) - Date.parse(g.mj_start)) / (7 * 86400000)));
  const mj = {
    shots: inj.length ? weeksBefore(inj[0]) + inj.length : mjDays >= 0 ? Math.floor(mjDays/7) + 1 : 0,
    logged: inj.length, lastShot: inj.length ? inj[inj.length - 1] : null,
    down: current != null ? +(g.mj_start_kg - current).toFixed(1) : null,
    journey: current != null && g.mj_start_kg !== goal ? (g.mj_start_kg - current)/(g.mj_start_kg - goal) : null
  };
  return { perType, completed, missed, unmarked, totalTraining,
    overallPct: totalTraining ? Math.min(1, completed/totalTraining) : 0, weekly, weights, wm, mj };
}
function mean(a){ return a.length ? a.reduce((s,x) => s + x, 0) / a.length : null; }
// Trend weight: 7-day rolling average, kg/week from a least-squares line over the
// last 4 weeks (8 if 4 is too thin), the rate needed to hit the goal date, and an ETA.
// No projection from fewer than 6 weigh-ins - a handful of readings is mostly noise.
function weightTrend(weights, todayISO, g){
  const DAY = 86400000, t0 = Date.parse(todayISO);
  const avg7 = weights.map(w => {
    const d = Date.parse(w.date);
    const win = weights.filter(x => { const xd = Date.parse(x.date); return xd <= d && xd > d - 7*DAY; });
    return +mean(win.map(x => x.body_weight)).toFixed(2);
  });
  const slope = win => {
    if(win.length < 4) return null;
    const xs = win.map(w => Date.parse(w.date) / DAY), ys = win.map(w => w.body_weight);
    if(Math.max(...xs) - Math.min(...xs) < 10) return null;
    const mx = mean(xs), my = mean(ys);
    let num = 0, den = 0;
    xs.forEach((x,i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) * (x - mx); });
    return den ? num / den * 7 : null;
  };
  const inLast = days => weights.filter(w => Date.parse(w.date) > t0 - days*DAY && Date.parse(w.date) <= t0);
  let rateWindow = 4, win = inLast(28);
  let rate = slope(win);
  if(rate == null){ win = inLast(56); rate = slope(win); rateWindow = 8; }
  const points = rate == null ? 0 : win.length;
  const last = weights.length ? weights[weights.length - 1] : null;
  const current7 = avg7.length ? avg7[avg7.length - 1] : null;
  let needed = null, datePassed = false, eta = null;
  if(current7 != null && g.target_date){
    const weeksLeft = (Date.parse(g.target_date) - t0) / (7*DAY);
    if(weeksLeft > 0) needed = (g.target_kg - current7) / weeksLeft; else datePassed = true;
  }
  if(rate != null && points >= 6 && current7 != null && current7 > g.target_kg && rate < -0.05){
    eta = new Date(t0 + (current7 - g.target_kg) / (-rate) * 7 * DAY).toISOString().slice(0,10);
  }
  return { avg7, current7, rate, rateWindow, points, needed, datePassed, eta, last,
    daysSince: last ? Math.round((t0 - Date.parse(last.date)) / DAY) : null,
    recent14: weights.filter(w => Date.parse(w.date) > t0 - 14*DAY && Date.parse(w.date) <= t0).length };
}
// 12-week training blocks: weeks 1-12 = block 1, 13-24 = block 2, and so on.
function blockOf(week){ return Math.floor((week - 1) / 12) + 1; }
function blockStats(rows, todayISO){
  const sorted = [...rows].sort((a,b) => a.date < b.date ? -1 : 1);
  const tr = sorted.find(r => r.date === todayISO) || sorted.filter(r => r.date <= todayISO).pop();
  if(!tr) return null;
  const one = n => {
    const br = sorted.filter(r => blockOf(r.week) === n);
    if(!br.length) return null;
    const counted = br.filter(r => r.focus !== 'Rest & Recover' && (r.date < todayISO || (r.date === todayISO && r.status !== 'Planned')));
    const done = br.filter(r => r.date <= todayISO && r.status === 'Completed' && r.trained_as !== 'Rest & Recover').length;
    const ws = br.filter(r => r.body_weight != null && r.date <= todayISO);
    return { block: n, startWeek: (n-1)*12 + 1, endWeek: n*12, from: br[0].date, to: br[br.length-1].date,
      sched: counted.length, done, pct: counted.length ? done / counted.length : 0,
      missed: br.filter(r => r.status === 'Missed').length,
      wChange: ws.length > 1 ? +(ws[ws.length-1].body_weight - ws[0].body_weight).toFixed(1) : null };
  };
  const b = blockOf(tr.week);
  return { cur: one(b), prev: b > 1 ? one(b - 1) : null, weekInBlock: ((tr.week - 1) % 12) + 1 };
}
// Estimated one-rep max (Epley). Only for sets with reps logged.
function e1rm(kg, reps){
  if(!(kg > 0) || !(reps > 0)) return null;
  return reps === 1 ? +kg : +(kg * (1 + reps / 30)).toFixed(1);
}
function strengthStats(rows){
  const types = ['Chest & Back','Shoulders & Arms','Legs'];
  const lifts = {'Chest & Back':'Incline Dumbbell Press','Shoulders & Arms':'Seated Barbell Overhead Press','Legs':'Machine Hack Squats'};
  return types.map(type => {
    const pts = rows.filter(r => r.top_set != null && (r.trained_as || r.focus) === type).sort((a,b) => a.date < b.date ? -1 : 1);
    if(!pts.length) return { type, lift: lifts[type], n: 0 };
    const first = +pts[0].top_set, last = +pts[pts.length-1].top_set;
    const maxes = pts.map(p => e1rm(+p.top_set, +p.top_reps)).filter(x => x != null);
    return { type, lift: lifts[type], n: pts.length, first, last, lastDate: pts[pts.length-1].date,
      best: Math.max(...pts.map(p => +p.top_set)), change: +(last - first).toFixed(1),
      bestE1rm: maxes.length ? Math.max(...maxes) : null };
  });
}
// Each lift's top set and the 7-day average body weight as a % of where they stood at
// the first logged top set, so lifts of different sizes share one scale. x = day number.
function strengthVsWeight(rows, weights, avg7){
  const logs = rows.filter(r => r.top_set != null).sort((a,b) => a.date < b.date ? -1 : 1);
  if(!logs.length || !weights.length) return null;
  const day = d => Math.round(Date.parse(d) / 86400000);
  const lifts = ['Chest & Back','Shoulders & Arms','Legs'].map(type => {
    const pts = logs.filter(r => (r.trained_as || r.focus) === type);
    if(pts.length < 2) return null;
    const base = +pts[0].top_set;
    return { type, data: pts.map(r => ({ x: day(r.date), y: +(+r.top_set / base * 100).toFixed(1) })) };
  }).filter(Boolean);
  if(!lifts.length) return null;
  const from = logs[0].date;
  let b = -1;
  weights.forEach((w, i) => { if(w.date <= from) b = i; });
  if(b < 0) b = 0;
  const body = weights.slice(b).map((w, i) => ({ x: day(w.date), y: +(avg7[b + i] / avg7[b] * 100).toFixed(1) }));
  return { lifts, body };
}
/* METRICS-END */

/* ====================== SYNC (Supabase REST + sign-in) ====================== */
let syncTimer = null, syncing = false, syncAgain = false, lastSyncErr = null;
function explainErr(e){
  if(!e) return '';
  if(e === 'signin') return 'The database only opens for your account. Sign in above to sync this device.';
  if(e === 'signin-expired') return 'Your sign-in has expired. Sign in again above.';
  if(/(^|\s)(401|403)/.test(e)) return session
    ? 'The server refused access for this account. Sign out, then sign in again.'
    : 'The server refused the request. Sign in above. If that fails, re-copy the anon public key (starts with eyJ) from the Legacy tab in Supabase.';
  if(/404/.test(e)) return 'Connected to the server, but the training_log table was not found. The Project URL may point to the wrong project.';
  if(/Failed to fetch|Load failed|NetworkError|fetch/i.test(e)) return 'Could not reach that address. The Project URL is probably mistyped. It must be exactly https://jjqfhsruxcgvyigfvboq.supabase.co with no spaces.';
  return 'Technical detail: ' + e;
}
function apiBase(){ return cfg.url.replace(/\/$/,''); }
function sbHeaders(){
  const tok = session && session.access_token ? session.access_token : cfg.key;
  return { 'apikey': cfg.key, 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' };
}
function saveSession(s){
  session = s;
  if(s) localStorage.setItem('as_session', JSON.stringify(s)); else localStorage.removeItem('as_session');
}
async function authCall(grant, body){
  const res = await fetch(apiBase() + '/auth/v1/token?grant_type=' + grant, { method: 'POST',
    headers: { 'apikey': cfg.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error('auth ' + res.status + ' ' + (j.error_description || j.msg || j.message || j.error || ''));
  return { access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: j.expires_at ? j.expires_at * 1000 : Date.now() + (j.expires_in || 3600) * 1000,
    email: (j.user && j.user.email) || (session && session.email) || '',
    uid: (j.user && j.user.id) || (session && session.uid) || '' };
}
async function ensureToken(force){
  if(!session) return;
  if(!force && session.expires_at - Date.now() > 90000) return;
  try{ saveSession(await authCall('refresh_token', { refresh_token: session.refresh_token })); }
  catch(e){
    if(/^auth 4\d\d/.test(e.message)){ saveSession(null); throw new Error('signin-expired'); }
    throw e;
  }
}
async function api(path, opts){
  opts = opts || {};
  await ensureToken();
  const go = () => fetch(apiBase() + path, { ...opts, headers: { ...sbHeaders(), ...(opts.headers || {}) } });
  let res = await go();
  if(res.status === 401 && session){ await ensureToken(true); res = await go(); }
  return res;
}
function badge(t){ document.getElementById('syncBadge').textContent = t; }
function scheduleSync(){
  if(!cfg) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, 1200);
}
async function pushRows(list){
  if(!list.length) return;
  const stamp = new Map(list.map(r => [r.date, r.updated_at]));
  const up = await api('/rest/v1/training_log', { method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates' }, body: JSON.stringify(list.map(r => toServer(r))) });
  if(!up.ok) throw new Error('push ' + up.status);
  // Only clear rows not edited again while the upload was in flight.
  for(const [d, u] of stamp){ const r = byDate(d); if(!r || r.updated_at === u) dirty.delete(d); }
}
// Supabase returns at most 1,000 rows per request, so read page by page until one comes
// back empty. The path must carry its own order= so the pages never overlap.
async function pullAll(path){
  const out = [];
  for(let guard = 0; guard < 100; guard++){
    const res = await api(path + '&offset=' + out.length);
    if(!res.ok) throw new Error('pull ' + res.status);
    const page = await res.json();
    if(!Array.isArray(page) || !page.length) break;
    out.push(...page);
  }
  return out;
}
// Goals: last write wins, by the time stamp inside the saved value.
async function syncGoals(){
  try{
    const res = await api('/rest/v1/app_settings?key=eq.goals&select=value');
    if(!res.ok) return;
    const arr = await res.json();
    const sv = arr[0] && arr[0].value;
    const localT = Date.parse(goals.updated_at) || 0;
    if(sv && (Date.parse(sv.updated_at) || 0) > localT){
      goals = Object.assign({}, DEFAULT_GOALS, sv); goalsDirty = false; saveGoalsLocal();
    } else if(goalsDirty){
      const up = await api('/rest/v1/app_settings', { method: 'POST', headers: { 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify([{ key: 'goals', value: goals, updated_at: goals.updated_at }]) });
      if(up.ok){ goalsDirty = false; saveGoalsLocal(); }
    }
  }catch(e){ /* goals stay local until the next sync */ }
}
// Daily Apple Health summary (steps, energy, heart, sleep) from the health_daily table.
// Before that table exists the request fails quietly and the panels stay hidden.
let health = load('as_health') || [];
async function pullHealth(){
  try{
    const since = addDays(todayStr(), -400);
    const list = await pullAll('/rest/v1/health_daily?select=date,steps,active_kcal,exercise_min,resting_hr,hrv,sleep_h&date=gte.' + since + '&order=date.asc');
    if(Array.isArray(list)){ health = list; localStorage.setItem('as_health', JSON.stringify(health)); }
  }catch(e){ /* no table yet, or offline: keep the last copy */ }
}
async function pullWorkouts(){
  try{
    const since = addDays(todayStr(), -400);
    const list = await pullAll('/rest/v1/workouts?select=id,date,name,start_at,duration_min,avg_hr,max_hr,active_kcal&date=gte.' + since + '&order=start_at.asc,id.asc');
    if(Array.isArray(list)){ workouts = list; localStorage.setItem('as_workouts', JSON.stringify(workouts)); }
  }catch(e){ /* keep the last copy */ }
}
// A planned training day with a Watch strength workout of 15+ minutes is marked Completed.
// Each date is judged once per device, so a day you set back by hand stays as you left it.
function isStrength(w){ return /strength|weight/i.test(w.name || ''); }
function autoComplete(){
  if(!workouts.length) return 0;
  const t = todayStr(); let n = 0;
  for(const r of rows){
    if(r.date > t || autoSeen.has(r.date)) continue;
    if(!workouts.some(w => w.date === r.date && isStrength(w) && (w.duration_min || 0) >= 15)) continue;
    autoSeen.add(r.date);
    if(goals.auto_complete && r.status === 'Planned' && r.focus !== 'Rest & Recover'){
      r.status = 'Completed';
      if(!r.trained_as) r.trained_as = r.focus;
      r.updated_at = new Date().toISOString();
      dirty.add(r.date); n++;
    }
  }
  localStorage.setItem('as_autoseen', JSON.stringify([...autoSeen]));
  if(n) persist();
  return n;
}
async function sync(){
  if(!cfg) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true; badge('syncing…');
  try{
    const server = await pullAll('/rest/v1/training_log?select=*&order=date.asc');
    // The first time the cloud has a top_reps column, send up reps kept on this device.
    if(server.length && !repsCol && 'top_reps' in server[0]){
      repsCol = true; localStorage.setItem('as_reps_col', 'true');
      const now = new Date().toISOString();
      rows.forEach(r => { if(r.top_reps != null){ r.updated_at = now; dirty.add(r.date); } });
    }
    if(server.length === 0){
      // An empty answer while signed out means the data is locked, not missing. Never seed then.
      if(!session) throw new Error('signin');
      await pushRows([...rows]);
    } else {
      // merge: last write wins per row
      for(const s of server){
        const l = byDate(s.date);
        if(!l){ rows.push(s); continue; }
        if(!dirty.has(s.date) || Date.parse(s.updated_at) >= Date.parse(l.updated_at)){
          Object.assign(l, s);
          dirty.delete(s.date);
        }
      }
      rows.sort((a,b)=>a.date<b.date?-1:1);
    }
    await syncGoals();
    await pullWorkouts();
    await pullHealth();
    const auto = autoComplete();
    if(rows.length) extendScheduleIfNeeded();
    if(dirty.size) await pushRows(rows.filter(r => dirty.has(r.date)));
    persist();
    lastSyncErr = null;
    const t = new Date();
    badge('synced ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0'));
    if(auto) toast('Apple Watch: ' + auto + ' session' + (auto > 1 ? 's' : '') + ' marked done', 2500);
    render();
  }catch(e){
    lastSyncErr = (e && e.message) ? e.message : String(e);
    if(lastSyncErr === 'signin' || lastSyncErr === 'signin-expired') badge('sign in to sync');
    else badge(navigator.onLine ? 'sync error - see Setup' : 'offline - will sync');
    if(cur === 'settings' || lastSyncErr.startsWith('signin')) render();
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; scheduleSync(); }
  }
}

/* ---------- Topic notes ----------
   Tap a topic (Protein, Sleep...) to write a note about it; as many per day as you like.
   Each one is saved as a line in the day's notes, "[Protein 08:10] 40 g shake", so sync,
   backups, CSV and the coaches carry on reading plain notes. The topic is also kept as a tag. */
const ENTRY_RE = /^\[([^\]]+?) (\d{1,2}:\d{2})\]\s?(.*)$/;

  Energy: 'e.g. strong all session', Carbs: 'e.g. rice and potatoes at lunch', Protein: 'e.g. 40 g shake' };
let composeTopic = null;
function parseNotes(notes){
  const free = [], entries = [];
  String(notes || '').split('\n').forEach(line => {
    const m = ENTRY_RE.exec(line.trim());
    if(m) entries.push({ topic: m[1], time: m[2], text: m[3] }); else free.push(line);
  });

}
function buildNotes(p){
  return [p.free, ...p.entries.map(e => `[${e.topic} ${e.time}] ${e.text}`)].filter(x => x && x.trim()).join('\n') || null;
}
// Grams in Protein notes ("40 g shake", "chicken 50g") add up to a day total.
const gramsIn = text => { const m = /(\d+(?:[.,]\d+)?)\s*(?:g|gr|grams?)\b/i.exec(text || ''); return m ? parseFloat(m[1].replace(',', '.')) : null; };
function proteinLine(parsed){
  const es = parsed.entries.filter(e => e.topic === 'Protein');

  if(!gs.length) return '<p class="muted" style="margin:6px 0 0">Add grams to Protein notes, like "40 g shake", to see a daily total.</p>';
  const total = Math.round(gs.reduce((a, b) => a + b, 0)), target = +goals.protein_target_g || 0;
  return `<div class="ptotal"><div><span class="eyebrow">Protein today</span><b>${total} g</b>${target ? `<small>of ${target} g</small>` : ''}</div>
    ${target ? `<div class="bar"><div style="width:${Math.min(100, total / target * 100).toFixed(0)}%;background:var(--brass)"></div></div>` : ''}</div>`;
}
const nowHM = () => { const n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); };
function composerHTML(parsed, tags){
  const t = composeTopic, orphanTag = tags.includes(t) && !parsed.entries.some(e => e.topic === t);
  return `<div class="composer">
    <div class="eyebrow">${esc(t)} &middot; ${nowHM()}</div>
    <input type="text" id="entryInput" autocomplete="off" enterkeyhint="done" placeholder="${esc(TOPIC_HINT[t] || 'Your note')}"

function removeEntry(i){
  const d = curDate(), r = byDate(d); if(!r) return;
  const p = parseNotes(r.notes), e = p.entries[i];
  if(!e || !confirm('Remove this ' + e.topic + ' note?')) return;
  p.entries.splice(i, 1);
  setField(d, 'notes', buildNotes(p));
  if(!p.entries.some(x => x.topic === e.topic) && Array.isArray(r.tags) && r.tags.includes(e.topic)){
    const tags = r.tags.filter(x => x !== e.topic);
    setField(d, 'tags', tags.length ? tags : null);
  }
  toast('Note removed');
  render(true);
}
function clearTag(){
  const d = curDate(), r = byDate(d); if(!r || !composeTopic) return;
  const tags = (Array.isArray(r.tags) ? r.tags : []).filter(x => x !== composeTopic);
  setField(d, 'tags', tags.length ? tags : null);
  composeTopic = null;
  render(true);
}

function renderPlan(){
  const el = document.getElementById('view-plan');
  const t = todayStr();
  let html = '';
  // Every week that exists - not a fixed 12 - so the rolling programme keeps showing.
  const weekNums = [...new Set(rows.map(r => r.week))].sort((a,b) => a-b);
  for(const w of weekNums){
    const wr = rows.filter(r => r.week === w);
    if(!wr.length) continue;
    if((w - 1) % 12 === 0) html += `<div class="block-h">BLOCK ${blockOf(w)} &middot; WEEKS ${w}-${w + 11}</div>`;
    html += `<div class="week-h">Week ${w}</div>`;
    html += wr.map(r => {
      const icon = STATUS_ICON[r.status] || STATUS_ICON.Planned;
      const off = r.status==='Completed' && r.trained_as !== r.focus;
      const wos = workoutsOn(r.date);
      const mins = wos.reduce((a,x) => a + (x.duration_min || 0), 0);
      return `<div class="day-row ${r.date===t?'today-row':''}" style="background:${COLORS[r.focus]};cursor:pointer" onclick="openDay('${r.date}')">
        <div class="d">${fmtD(r.date)}</div>
        <div class="f" style="color:${DCOLORS[r.focus]}">${r.focus}
          ${off ? `<div class="offplan">Did: ${esc(r.trained_as)}</div>` : ''}
          ${r.body_weight != null ? `<span class="muted" style="font-weight:400"> &middot; ${r.body_weight} kg</span>` : ''}
          ${wos.length ? `<span class="muted" style="font-weight:400"> &middot; ${Math.round(mins)} min</span>` : ''}
        </div>
        <div class="s">${icon}</div>
      </div>`;
    }).join('');
  }
  el.innerHTML = html;
  const tr = el.querySelector('.today-row');
  if(tr && cur === 'plan') setTimeout(()=>tr.scrollIntoView({block:'center'}), 50);
}

    d.querySelectorAll('.jentry').forEach(e => {
      const hit = (!jQ || e.textContent.toLowerCase().includes(jQ))
        && (!jTag || (e.dataset.tags || '').split(',').includes(jTag));
      e.style.display = hit ? '' : 'none';

      e.querySelectorAll('[data-topic]').forEach(x => { x.style.display = !jTag || x.dataset.topic === jTag ? '' : 'none'; });

function mjCard(m){
  const t = todayStr(), dose = currentDose(t);
  const ds = [...(goals.doses || [])].sort((a,b) => a.from < b.from ? -1 : 1);
  const inj = [...(goals.injections || [])].sort((a,b) => a.date < b.date ? 1 : -1);
  const since = m.mj.lastShot ? Math.round((Date.parse(t) - Date.parse(m.mj.lastShot)) / 86400000) : null;
  // Dose timeline in weeks: each dose runs until the next begins, then a hatched plan block
  // at the current dose up to the goal date.
  const wk = d => Math.floor((Date.parse(d) - Date.parse(goals.mj_start)) / (7 * 86400000));
  const weeks = goals.mj_start && goals.mj_start <= t ? wk(t) + 1 : 0;
  const past = ds.filter(d => d.from <= t);
  const spans = weeks ? past.map((d, i) => ({ mg: d.mg,
    weeks: Math.max(1, (i + 1 < past.length ? wk(past[i + 1].from) : wk(t) + 1) - Math.max(0, wk(d.from))) })) : [];
  const planWeeks = weeks && dose && goals.target_date && goals.target_date > t ? Math.max(0, wk(goals.target_date) - wk(t)) : 0;
  const cols = ['var(--navy)', 'var(--brass)', 'var(--good)'];
  const timeline = spans.length ? `<div class="doses" role="img" aria-label="${spans.map(s => s.mg + ' mg for ' + s.weeks + ' weeks').join(', ')}">
      ${spans.map((s, i) => `<div style="flex:${s.weeks} 1 0;background:${cols[i % 3]}">${s.mg} mg</div>`).join('')}
      ${planWeeks ? `<div class="plan" style="flex:${planWeeks} 1 0">Plan</div>` : ''}</div>
    <div class="dlegend">${spans.map(s => `<span>${s.mg} mg &middot; ${s.weeks} wk</span>`).join('')}${planWeeks ? `<span>Plan: ${dose.mg} mg to ${shortDate(goals.target_date)} &middot; ${planWeeks} wk</span>` : ''}</div>` : '';
  return `<div class="card">
    <h2>Mounjaro${dose ? ' &middot; ' + dose.mg + ' mg weekly' : ''}</h2>
    <p class="muted" style="margin:0 0 8px">${weeks ? 'Week ' + weeks + ' &middot; ' : ''}${m.mj.shots} shots since ${fmtDY(goals.mj_start)}${m.mj.logged ? '' : ' (est.)'}${m.mj.down != null && m.mj.down > 0 ? ' &middot; ' + m.mj.down.toFixed(1) + ' kg down from ' + goals.mj_start_kg : ''}</p>
    ${timeline}
    <label class="fld">Log a shot</label>
    <div class="row2">
      <div><input type="date" id="injDate" value="${todayStr()}"></div>
      <div><input type="text" inputmode="decimal" id="injMg" value="${dose ? dose.mg : ''}" placeholder="mg"></div>
    </div>
    <button class="primary" onclick="logShot()">Log shot</button>
    ${since != null
      ? `<p class="${since > 8 ? 'warnline' : 'muted'}" style="font-size:12px;margin:8px 0 0">Last shot ${fmtD(m.mj.lastShot)} (${since === 0 ? 'today' : since === 1 ? 'yesterday' : since + ' days ago'}).</p>`
      : '<p class="muted" style="margin:8px 0 0">No shots logged yet. Until you log one, the count assumes one a week since the start date.</p>'}
    ${inj.length ? `<details style="margin-top:6px"><summary class="muted" style="cursor:pointer">Shot history (${inj.length})</summary>
      <table>${inj.map(i => `<tr><td>${fmtDY(i.date)}</td><td class="num">${i.mg} mg</td>
        <td class="num"><button class="link" style="color:var(--bad);padding:0;font-size:13px" onclick="removeShot('${i.date}')">remove</button></td></tr>`).join('')}</table></details>` : ''}
    <p class="muted" style="margin:8px 0 0">Doses: ${ds.map(d => d.mg + ' mg from ' + fmtDY(d.from)).join(' &middot; ')}. Change under Setup.</p>
  </div>`;
}

// How many times a top set beat the best before it, across the three first lifts.
function topSetRecords(){
  let n = 0;
  TYPES.forEach(type => {
    let best = null;
    rows.filter(r => r.top_set != null && (r.trained_as || r.focus) === type).sort((a,b) => a.date < b.date ? -1 : 1)
      .forEach(r => { const v = +r.top_set; if(best != null && v > best) n++; if(best == null || v > best) best = v; });
  });
  return n;
}
function tilesStrip(m){

    <div class="tile"><span class="eyebrow">Sessions done</span><b>${doneSessions().length}</b><small>since ${rows.length ? fmtDY(rows[0].date) : '–'}</small></div>
    <div class="tile"><span class="eyebrow">Hours trained</span><b>${Math.round(mins / 60)}</b><small>Apple Watch workouts</small></div>
    <div class="tile"><span class="eyebrow">Top-set records</span><b>${topSetRecords()}</b><small>Times you beat your best</small></div>
    <div class="tile"><span class="eyebrow">Weigh-ins</span><b>${m.weights.length}</b><small>${lastW ? 'Latest ' + fmtD(lastW.date) : 'None yet'}</small></div>
  </div>`;
}
function bodyCard(m){
  const h = +goals.height_m, w = m.wm;
  if(!h) return `<div class="card"><h2>BMI &amp; body composition</h2><p class="muted" style="margin:0">Add your height under Setup &rarr; Goals to see your BMI here, with your waist and body-fat estimate.</p></div>`;
  const bmi = kg => (kg / (h * h)).toFixed(1);
  const cells = [[bmi(goals.mj_start_kg), 'BMI at the ' + goals.mj_start_kg + ' kg start']];
  if(w) cells.push([bmi(w.current), 'BMI now']);
  cells.push([bmi(goals.target_kg), 'BMI at ' + goals.target_kg + ' kg']);
  const bf = Array.isArray(goals.body_fat) && goals.body_fat.length === 2 ? goals.body_fat : null;
  if(w && bf){
    const lean = bf.map(f => Math.round(w.current * (1 - f / 100)));
    cells.push([bf[0] === bf[1] ? bf[0] + '%' : bf[0] + '–' + bf[1] + '%', 'Body fat, your estimate']);
    cells.push([(lean[0] === lean[1] ? lean[0] : lean[1] + '–' + lean[0]) + ' kg', 'Lean mass: muscle, bone, water']);
  }
  if(goals.waist_in){
    const cm = goals.waist_in * 2.54;
    cells.push([goals.waist_in + ' in', 'Waist (' + Math.round(cm) + ' cm), ' + (cm / (h * 100)).toFixed(2) + ' of height']);
  }

    <div class="pbs three">${cells.map(([v, l]) => `<div class="pb"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    <p class="muted" style="margin:10px 0 0">Height ${h} m. BMI only knows height and weight, so it can't tell muscle from fat, and with your muscle it reads high. Your waist and body fat tell you more; around 0.5 of your height is the usual waist guide. Update them under Setup.</p></div>`;
}
// Apple Health panels: monthly averages of steps, active energy, resting heart rate, HRV and sleep.
function healthMonths(){
  const t = todayStr(), full = health.filter(h => h.date < t);
  const months = [...new Set(full.map(h => h.date.slice(0, 7)))].sort();
  const avg = (key, m) => { const v = full.filter(h => h.date.startsWith(m) && h[key] != null).map(h => +h[key]); return v.length ? +(v.reduce((a, b) => a + b, 0) / v.length).toFixed(1) : null; };
  return { months, labels: months.map(m => new Date(m + '-15T12:00:00').toLocaleDateString('en-GB', { month: 'short' })), avg };
}
function healthCards(){
  if(!health.length) return cfg ? `<div class="card"><h2>Apple Health</h2><p class="muted" style="margin:0">Steps, sleep and heart rate show here once the Apple Health feed is set up. See Setup &rarr; Advanced settings &rarr; Apple Watch &amp; Health feeds.</p></div>` : '';

function replanFuture(){
  const t = todayStr(), sorted = [...rows].sort((a,b) => a.date < b.date ? -1 : 1);
  let rot = 0;
  for(let i = sorted.length - 1; i >= 0; i--){
    if(sorted[i].date > t) continue;
    const idx = ROT.indexOf(sorted[i].focus); if(idx >= 0){ rot = (idx + 1) % 3; break; }
  }
  let n = 0;
  for(const r of sorted){
    if(r.date <= t) continue;
    const untouched = r.status === 'Planned' && r.body_weight == null && !r.notes && r.top_set == null && !(Array.isArray(r.tags) && r.tags.length);
    if(!untouched){ const idx = ROT.indexOf(r.trained_as || r.focus); if(idx >= 0) rot = (idx + 1) % 3; continue; }
    const focus = restDays().includes(r.day) ? 'Rest & Recover' : ROT[rot];
    if(focus !== 'Rest & Recover') rot = (rot + 1) % 3;
    if(r.focus !== focus){
      r.focus = focus; r.trained_as = focus; r.target_muscles = MUSCLES[focus];
      r.updated_at = new Date().toISOString(); dirty.add(r.date); n++;
    }
  }
  if(n){ persist(); scheduleSync(); render(true); }
  return n;
}

// Chalk dust drifting up through the spotlight. Still, with fewer specks, under reduced motion.
function startDust(canvas){
  const ctx = canvas && canvas.getContext('2d');
  if(!ctx) return () => {};
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches, dpr = Math.min(2, window.devicePixelRatio || 1);
  let W = 0, H = 0, raf = 0, alive = true;
  const size = () => { W = canvas.clientWidth; H = canvas.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); window.addEventListener('resize', size);
  const ps = [...Array(still ? 24 : 60)].map(() => ({ x: Math.random() * W, y: Math.random() * H,
    r: .4 + Math.random() * 1.8, v: .08 + Math.random() * .35, a: .05 + Math.random() * .25, s: Math.random() * 6.28 }));
  const frame = () => {
    ctx.clearRect(0, 0, W, H);
    for(const p of ps){
      if(!still){ p.y -= p.v; p.s += .01; p.x += Math.sin(p.s) * .15; if(p.y < -5){ p.y = H + 5; p.x = Math.random() * W; } }
      const glow = Math.max(0, 1 - Math.hypot(p.x - W * .88, p.y + H * .08) / (H * .75));
      ctx.globalAlpha = Math.min(.6, p.a + glow * .35);
      ctx.fillStyle = glow > .3 ? '#f6dca3' : '#f4efe4';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    if(alive && !still) raf = requestAnimationFrame(frame);
  };
  frame();
  return () => { alive = false; cancelAnimationFrame(raf); window.removeEventListener('resize', size); };
}

function animateWelcome(el){

  if(!arc || !num) return;
  const C = parseFloat(arc.style.strokeDasharray), toArc = +arc.dataset.to, toNum = +num.dataset.to;
  const set = k => { arc.style.strokeDashoffset = C - (C - toArc) * k; num.textContent = (toNum * k).toFixed(1); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ set(1); return; }
  const t0 = performance.now() + 250, dur = 1400;
  const step = now => { const k = Math.max(0, Math.min(1, (now - t0) / dur)); set(1 - Math.pow(1 - k, 3)); if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// A home-screen app can stay "open" for weeks, so top the schedule up and re-check
// the date every time it returns to the foreground, not only on a cold start.
let lastSeenDay = todayStr();
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  maybeWelcome();
  const added = extendScheduleIfNeeded();
  if(added || todayStr() !== lastSeenDay){ lastSeenDay = todayStr(); render(true); }
  if(cfg) sync();
});
// Register with updateViaCache:'none' so the worker script is never served from
// the HTTP cache - updates reach the phone on the next open, not a day later.
if('serviceWorker' in navigator){
  // Every release changes sw.js (its CACHE name), so a new worker taking over means a new
  // version. Reload then, so the phone runs it straight away instead of the copy it has kept
  // in memory. Not on the very first install, and never while a field is being typed in.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  const reloadForUpdate = () => {
    if(reloading) return;
    const ae = document.activeElement;
    if(ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type !== 'checkbox'))){
      setTimeout(reloadForUpdate, 1500);   // try again once the field is left
      return;
    }
    reloading = true;
    try{ sessionStorage.setItem('as_updated', '1'); }catch(e){}
    location.reload();
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(hadController) reloadForUpdate(); });
  try{
    if(sessionStorage.getItem('as_updated')){ sessionStorage.removeItem('as_updated'); toast('Arnold updated to version ' + APP_VERSION, 2500); }
  }catch(e){}
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update();
    document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update(); });
  }).catch(()=>{});
}
</script>

<script>
// User-initiated data copy to Brent's private Arnold plugin. Never exports credentials.
const ARNOLD_COACH_ORIGIN = 'https://arnold-training-coach.brentgrant.chatgpt.site';
let arnoldCoachWindow = null;
function openChatGPTCoach(){
  arnoldCoachWindow = window.open(ARNOLD_COACH_ORIGIN + '/', 'arnold-training-coach');
  if(!arnoldCoachWindow) toast('Allow the coach tab to open, then try again.');
}
window.addEventListener('message', async function(event){
  if(event.origin !== ARNOLD_COACH_ORIGIN || !arnoldCoachWindow || event.source !== arnoldCoachWindow) return;
  if(event.data?.type !== 'arnold-coach-request' || typeof event.data.requestId !== 'string' || event.data.requestId.length > 100) return;
  const child = arnoldCoachWindow;
  const requestId = event.data.requestId;
  try {
    const snapshot = await window.arnoldBackup();
    const cloud = cfg && !session ? {url:cfg.url,key:cfg.key} : null;
    child.postMessage({type:'arnold-coach-snapshot',requestId,snapshot:cloud ? null : snapshot,cloud}, ARNOLD_COACH_ORIGIN);
  } catch(e) {
    child.postMessage({type:'arnold-coach-error',requestId}, ARNOLD_COACH_ORIGIN);
  }
});
</script>
